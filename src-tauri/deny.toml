# Política de dependências (cargo-deny). Somente plataformas de destino relevantes.
[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
# Vulnerabilidades sempre falham; avisos de crates não mantidas são revisados no relatório.
unmaintained = "workspace"
yanked = "deny"

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "MPL-2.0", "BSL-1.0", "CC0-1.0", "Unlicense", "0BSD", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
